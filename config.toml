git-branch-prefix = "feature/<epic>/<linear-branch>"
git-commit-instructions = '''
Write commit messages in this format:

<type>[scope]: <imperative subject <= 50 chars>

<body wrapped around 72 chars>

<issue footer, only when an issue exists>

Allowed types:
feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.

Rules:
- Use square-bracket scope, like `fix[inventory]: ...`.
- Write the subject in imperative mood.
- Keep the subject concrete and at 50 characters or less.
- Use real newlines. Never include literal `\n` sequences.
- Wrap body lines around 72 characters.
- Explain what changed and why, not every implementation detail.
- Include an issue footer only when a real issue exists, such as `part of FAR-438` or `closes FAR-438`.
- Do not invent issue ids.
- Do not assume all Awra apps use the same issue prefix.
- Do not mention agents, lanes, worktrees, branches, or process bookkeeping in the subject.
- Keep commits atomic: one logical change per commit.
- Before committing, check the worktree and stage only files that belong to the commit.
- Before any history rewrite, check whether the branch exists on `origin`.
- Do not rewrite pushed history unless Javier explicitly approves after that check.

Good examples:
fix[inventory]: reject duplicate stock rows
docs[agents]: index shared Awra docs
test[catalogue]: cover Rappi import dry run

Bad examples:
fix[inventory]: improved upload flow
chore[repo]: cleanup
refactor[api]: make code better

Full example:
```
fix[inventory]: gate Rappi sends by catalogue

Only send Rappi inventory rows for products that belong to the
channel catalogue. Keep Awra stock writes unchanged and return a
structured skip reason for excluded rows.

part of FAR-438
```'''
git-pr-instructions = """
Generate a pull request title and description from the change details below.

PR title rules:
- Use `Feature: <Epic or Module> - <Description>` for new capability or meaningful expansion.
- Use `Fix: <Epic or Module> - <Description>` for bug fixes, regressions, or corrective changes.
- Keep the title concrete and specific.
- Do not use vague words like “improve”, “cleanup”, “enhance”, or “update” unless the exact behavior is named.
- Do not mention agents, branches, worktrees, or implementation bookkeeping.
- Do not invent issue IDs.

PR description rules:
- Be direct and concise.
- Explain what changed and why.
- Include tests/checks actually run.
- If checks were not run, say `Not run` and explain why.
- Mention migrations, config changes, or operational impact if relevant.
- Mention risks or rollback notes if relevant.
- Do not include hype or broad strategy language.

Use this format:

Title:
<generated PR title>

Description:
## Summary
- <what changed>
- <why it matters>

## Changes
- <concrete change 1>
- <concrete change 2>
- <concrete change 3>

## Checks
- <command or verification result>
- <command or verification result>

## Migrations / Config
- <migration or config note, or `None`>

## Risks / Rollback
- <risk or rollback note, or `None`>

## Linked Issues
- <issue id or `None`>

Change details:
<paste diff summary, commit messages, files changed, checks run, and issue context here>"""
