name: Mac and Windows portability
on:
  push:
    branches: [main, feature/codex/personal-skills-plugin]
  pull_request:
permissions:
  contents: read
jobs:
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-dev.txt -r plugins/javier/requirements.txt
      - run: python scripts/check.py
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/runtime_check.py
