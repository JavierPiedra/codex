prompt = "Generate a daily Rappi inventory freshness report.\n\nUse the repo's existing Supabase client. Read only. Do not mutate data, run migrations, change schema, close stores, or call external Rappi APIs.\n\nFirst read this compact memory file:\n/Users/javierpiedra/.codex/automations/rappi-inveotry-upload-report/memory.md\n\nPrimary execution path:\n1. Use the wrapper command below. Do not replace it with inline `cd`, env assignments, or `poetry run`.\n2. Run exactly:\n\n```bash\n/Users/javierpiedra/.codex/automations/rappi-inveotry-upload-report/run_report.sh\n```\n\nWhy the wrapper is required:\n- Codex rules can allow an exact command prefix to run outside the sandbox.\n- Inline shell commands with env assignments may be evaluated as one shell invocation and miss narrower allow rules.\n- The wrapper rejects all arguments, changes to `/Users/javierpiedra/Desktop/farcoyo`, sets `POETRY_VIRTUALENVS_PATH`, and runs the read-only helper.\n- `~/.codex/rules/default.rules` contains an allow rule for this exact wrapper path.\n- Restart Codex after rule changes so the rule is loaded.\n\nImportant runtime note:\n- Javier's normal shell resolves and connects to `cjllsdrxbparqeskafhb.supabase.co`.\n- Fresh Codex automation sessions previously had two separate runtime issues:\n  - DNS resolver failure.\n  - Outbound HTTPS connect denied with `[Errno 1] Operation not permitted`.\n- Do not tell Javier to change Mac/router DNS if his shell resolves the host.\n- The helper includes a last-resort pinned IP override for this exact Supabase project host: `104.18.38.10`, `172.64.149.246`.\n\nExit code handling:\n- `0`: report generated.\n- `2`: local setup issue such as missing repo, env vars, or dependencies; follow the helper instructions.\n- `3`: DNS preparation failed; retry up to 3 total helper attempts with 10-second waits.\n- `4`: outbound TCP/HTTPS connection to Supabase was denied before table reads, often `Operation not permitted`; do not apply DNS retries, and report this as a sandbox/rules/network-permission blocker.\n- `5`: Supabase read failed after DNS/TCP preparation; do not apply DNS retries, and report the exact helper error.\n- `64`: wrapper was called with arguments; fix the automation to call the wrapper with no args.\n\nDNS diagnostics:\n- If exit code `3`, inspect `Resolver diagnostics`.\n- If diagnostics do not mention `pinned project host IP override`, the run used an old helper or the helper path is wrong.\n- If diagnostics mention `pinned project host IP override returned no A records`, the `SUPABASE_URL` host likely changed or the helper override is missing/mismatched.\n\nRetry policy:\n- Only exit code `3` gets the 10-second retry loop.\n- Do not reuse stale report counts from memory while retrying.\n\nIf Python dependencies are missing, install locked main dependencies only and rerun:\n\n```bash\ncd /Users/javierpiedra/Desktop/farcoyo\nPOETRY_VIRTUALENVS_PATH=\"$PWD/.poetry-venvs\" poetry install --only main --no-root\n/Users/javierpiedra/.codex/automations/rappi-inveotry-upload-report/run_report.sh\n```\n\nIf Supabase env vars are missing, print the exact env var names needed and stop. Do not print secret values.\n\nReport goal:\nReport how many hours have passed since the latest inventory upload for every pharmacy that is ready to upload inventory to Rappi.\n\nTables:\n- pharmacies\n- pharmacy_delivery_services\n- pharmacy_update_manifests\n\nRappi delivery service ID:\n6665ad88-e23f-4d6b-a40d-37c702f38bfd\n\nReady-to-upload criteria:\nA pharmacy is ready to upload inventory if it has a pharmacy_delivery_services row for Rappi where at least one of these columns is not null:\n- inventory_enabled_at\n- orders_enabled_at\n- channel_user_created_at\n- credentials_sent_at\n\nDo not use pharmacy_delivery_services.is_active as part of this gate.\nDo not use pharmacies.approved as part of this gate.\nDo not include pharmacies with no Rappi row.\nDo not include pharmacies where only enablement_requested_at is set.\nDo not include pharmacies where all onboarding timestamps are null.\n\nFor each ready-to-upload pharmacy:\n1. Find the latest row in pharmacy_update_manifests by pharmacy_id.\n2. Prefer created_at DESC for latest upload.\n3. Use rappi_job_id as the inventory job ID.\n4. Calculate hours_since_latest_upload as the difference between now and latest manifest created_at.\n5. If no manifest exists, mark latest_manifest_created_at and latest_job_id as null, and classify as CRITICAL.\n\nSeverity:\n- OK: latest upload is less than or equal to 24 hours ago.\n- CONTACT: latest upload is more than 24 hours ago and less than or equal to 30 hours ago.\n- CLOSE_STORE: latest upload is more than 30 hours ago.\n- CRITICAL: no inventory manifest exists for a ready-to-upload pharmacy.\n\nOutput:\nPrint a Markdown report with:\n1. Report timestamp.\n2. Summary counts:\n   - total_ready_to_upload\n   - ok_count\n   - contact_count\n   - close_store_count\n   - critical_no_manifest_count\n3. A Markdown table sorted by severity first, then hours_since_latest_upload DESC.\n\nTable columns:\n- severity\n- pharmacy_id\n- pharmacy_name\n- rappi_store_id\n- latest_manifest_id\n- latest_job_id\n- latest_manifest_created_at\n- hours_since_latest_upload\n- latest_manifest_status\n- action_needed\n\nAction rules:\n- OK: No action.\n- CONTACT: Contact pharmacy to request inventory upload.\n- CLOSE_STORE: Close store in Rappi portal and contact pharmacy.\n- CRITICAL: Investigate missing inventory upload history immediately.\n\nImportant:\n- Include only ready-to-upload Rappi pharmacies.\n- Do not include pharmacies outside the ready-to-upload criteria.\n- Do not perform the close-store action automatically. This report only flags stores that need closure.\n- Do not call Rappi APIs.\n- Do not mutate Supabase data.\n\nAfter the report is generated successfully, use [@spreadsheets](plugin://spreadsheets@openai-primary-runtime) to update the existing Google Sheet:\n\nSpreadsheet:\nhttps://docs.google.com/spreadsheets/d/17JmP933w8gw2P3_I_SKutaP-azkGxGDrmEcyg50tlxI\n\nSheet tab:\nHoja 1\n\nUpdate rules:\n- Only update the sheet after the wrapper exits with code 0.\n- Replace the current report rows with today’s ready-to-upload Rappi pharmacies.\n- Keep this ops-facing column shape:\n  - severity\n  - pharmacy_id\n  - pharmacy_name\n  - rappi_store_id\n  - hours_since_latest_upload\n  - action_needed\n  - phone_number\n  - main_contact_name\n  - 1er toque\n  - notas\n- Preserve existing manual values by `pharmacy_id` for:\n  - phone_number\n  - main_contact_name\n  - 1er toque\n  - notas\n- For pharmacies newly appearing in the report, leave phone_number, main_contact_name, 1er toque, and notas blank unless that data is already available from the existing sheet.\n- Keep the same severity ordering as the report.\n- Highlight `CLOSE_STORE` rows for ops follow-up.\n- Do not mutate Supabase.\n- Do not call Rappi APIs.\n- Do not close stores automatically."
